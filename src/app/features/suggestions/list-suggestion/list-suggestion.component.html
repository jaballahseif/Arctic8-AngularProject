<div class="container mt-5">
  <div class="row mb-4 align-items-center">
    <div class="col-md-6">
      <h1 class="display-5 fw-bold text-primary mb-0">{{ titre }}</h1>
    </div>
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text bg-white"
          ><i class="bi bi-search"></i>🔎</span
        >
        <input
          [(ngModel)]="search_term"
          type="text"
          class="form-control form-control-lg"
          [placeholder]="textPlaceholder"
        />
      </div>
      <small class="text-muted" *ngIf="search_term"
        >Recherche en cours: <strong>{{ search_term }}</strong></small
      >
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="d-flex flex-column gap-3">
        <div *ngFor="let s of suggestions">
          <div
            class="card shadow-sm border-0 h-100"
            *ngIf="
              s.title
                .toLocaleLowerCase()
                .includes(search_term.toLocaleLowerCase()) ||
              s.category
                .toLocaleLowerCase()
                .includes(search_term.toLocaleLowerCase())
            "
          >
            <div class="card-body position-relative">
              <span
                class="badge position-absolute top-0 end-0 m-3"
                [ngClass]="{
                  'bg-success': s.status === 'acceptee',
                  'bg-danger': s.status === 'refusee',
                  'bg-warning text-dark':
                    s.status === 'en attente' ||
                    (s.status !== 'acceptee' && s.status !== 'refusee'),
                }"
                >{{ s.status }}</span
              >

              <h3 class="card-title h5 text-dark mb-1">{{ s.title }}</h3>

              <div class="mb-3">
                <span class="badge bg-secondary me-2">{{ s.category }}</span>
                <small class="text-muted"
                  ><i class="bi bi-calendar"></i>
                  {{ s.date | date: "dd MMM yyyy" }}</small
                >
              </div>

              <p class="card-text text-secondary">{{ s.description }}</p>

              <hr class="text-muted alpha-2" />

              <div
                *ngIf="s.status != 'refusee'"
                class="d-flex justify-content-between align-items-center mt-3"
              >
                <div>
                  <button
                    class="btn btn-outline-danger btn-sm me-2 rounded-pill"
                    (click)="like(s)"
                  >
                    ❤️ {{ s.nbLikes }}
                  </button>
                  <button
                    (click)="addToFavoris()"
                    class="btn btn-outline-warning btn-sm rounded-pill"
                  >
                    ⭐ Favoris
                  </button>
                </div>
                <button
                  [routerLink]="['/suggestions', s.id]"
                  class="btn btn-primary btn-sm rounded-pill px-3"
                >
                  Détails <span aria-hidden="true">&rarr;</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
