<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h2 class="h4 mb-0">Ajouter une suggestion</h2>
        </div>
        <div class="card-body">
          <form [formGroup]="myform">
            <div class="mb-3">
              <label class="form-label fw-bold">Titre</label>
              <input type="text" formControlName="title" class="form-control" />
              <div
                *ngIf="
                  myform.get('title')?.touched &&
                  myform.get('title')?.errors?.['required']
                "
                class="text-danger mt-1 small"
              >
                Titre est obligatoire
              </div>
              <div
                *ngIf="
                  myform.get('title')?.touched &&
                  myform.get('title')?.errors?.['minlength']
                "
                class="text-danger mt-1 small"
              >
                Titre doit contenir au moins 3 caractères
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Description</label>
              <textarea
                formControlName="description"
                class="form-control"
                rows="4"
                [ngClass]="{
                  'is-invalid':
                    myform.get('description')?.invalid &&
                    myform.get('description')?.touched,
                }"
                placeholder="Détaillez votre suggestion..."
              ></textarea>
              <div
                *ngIf="
                  myform.get('description')?.invalid &&
                  myform.get('description')?.touched
                "
                class="invalid-feedback"
              >
                Description est obligatoire
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Catégorie</label>
              <select formControlName="category" class="form-select">
                <option value="">Sélectionner une catégorie</option>
                <option value="Technologie">Technologie</option>
                <option value="Événements">Événements</option>
                <option value="Ressources Humaines">Ressources Humaines</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Date</label>
              <input type="date" formControlName="date" class="form-control" />
            </div>

            <div class="d-grid">
              <button
                type="submit"
                [disabled]="myform.invalid"
                class="btn btn-primary btn-lg"
              >
                Ajouter la suggestion
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
