<div class="form-container">
    <h2>Ajouter une suggestion</h2>
    <form [formGroup]="myform">
        <div class="form-group">
            <label>Titre</label>
            <input type="text" formControlName="title" class="form-control">
            <div *ngIf="myform.get('title')?.invalid && myform.get('title')?.touched" class="error">
                Titler est obligatoire (min 3 caractères)
            </div>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea formControlName="description" class="form-control"></textarea>
            <div *ngIf="myform.get('description')?.invalid && myform.get('description')?.touched" class="error">
                Description est obligatoire
            </div>
        </div>

        <div class="form-group">
            <label>Catégorie</label>
            <select formControlName="category" class="form-control">
                <option value="">Sélectionner une catégorie</option>
                <option value="Technologie">Technologie</option>
                <option value="Événements">Événements</option>
                <option value="Ressources Humaines">Ressources Humaines</option>
            </select>
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" formControlName="date" class="form-control">
        </div>

        <button type="submit" [disabled]="myform.invalid" class="btn-submit">Ajouter</button>
    </form>
</div>
